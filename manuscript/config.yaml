# die_another_day — ICARUS (Die Another Day, 2002) manuscript configuration
# This file is the meta-artifact linking manuscript prose to the execution layer.
# It is loaded by `src/die_another_day/manuscript_variables.py::load_manuscript_config`
# and hydrated into `{{TOKEN}}`s by `scripts/z_generate_manuscript_variables.py`.

paper:
  # RASP Standard: Title must be descriptive and objective
  title: "Die Another Day: ICARUS — Special-Agent Mission Software"
  subtitle: "Six deterministic mission models: biometric and DNA identity-replacement screening, ice-palace thermal, immersion, and structural operations, and orbital-mirror targeting"
  version: "0.1.0"
  date: "2026-08-04"

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true

publication:
  github_repository: "docxology/die_another_day"
  repository_url: "https://github.com/docxology/die_another_day"
  journal: "BOND Suite Technical Series"
  year: "2026"

keywords:
  - "identity-replacement detection"
  - "gene-therapy trait drift"
  - "Mahalanobis distance screening"
  - "DNA sequence identity verification"
  - "k-mer fingerprint similarity"
  - "cold-environment operations planning"
  - "cold-water immersion hypothermia"
  - "ice bearing capacity and thermal stress"
  - "orbital mirror targeting"
  - "special-agent mission software"
  - "reproducible research"

metadata:
  license: "MIT"
  language: "en"

# Render format toggles — gate per-renderer in infrastructure/rendering/pipeline.py.
render:
  formats:
    pdf: true
    html: true
    slides: true
    docx: false
    epub: false

# Consumed by manuscript rendering gates: ZERO-MOCK TOLERANCE.
testing:
  max_test_failures: 0
  max_infra_test_failures: 0
  max_project_test_failures: 0

# Mission concept parameters — read by `src/die_another_day/` and `scripts/`.
concepts:
  identity:
    num_biomarkers: 6
    alpha: 0.001
    std_threshold: 3.0
    min_markers: 2
    seed: 7
  sequence_identity:
    genome_length: 1500
    kmer_k: 9
    match_jaccard: 0.90
    cluster_min: 12
    scattered_errors: 5
    seed: 7
  ice_ops:
    env_temp_c: -34.0
    critical_temp_c: 30.0
    body_temp_c: 37.0
    decay_rate_h: 0.8
    num_operatives: 4
    op_duration_s: 1800
    thermal_conductance: 1500.0
  hypothermia:
    water_temp_c: 10.0
    body_mass_kg: 75.0
    insulation_factor: 0.9
    distance_m: 400.0
    sweep_speed_m_s: 2.0
    seed: 7
  ice_structure:
    thickness_cm: 30.0
    load_tons: 3.0
    delta_t_c: 15.0
    ice_strength_mpa: 1.5
    seed: 7
  orbital_mirror:
    # A circular LEO orbit inclined 65 deg so it reaches the 60N target.
    semi_major_axis_km: 7200.0
    inclination_deg: 65.0
    raan_deg: 0.0
    mean_anomaly_deg: 320.0
    target_lat_deg: 60.0
    target_lon_deg: 15.0
    jd_start: 2461300.5
    duration_s: 3000.0
    dt_s: 60.0
    mirror_area_m2: 10000.0
    reflectivity: 0.90
    beam_half_angle_deg: 0.02
    min_elevation_deg: 10.0
    seed: 7
